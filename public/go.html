<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting…</title>
  <script src="/assets/lz-string.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      padding: 2.5rem 2rem;
      border: 1px solid #262626;
      border-radius: 16px;
      background: #111;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #262626;
      border-top-color: #e5e5e5;
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      animation: spin 0.8s linear infinite;
    }
    .icon-badge {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      font-size: 1.75rem;
    }
    .badge-expired {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    .badge-limit {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #f59e0b;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
    .status-pill {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      margin-bottom: 0.75rem;
    }
    .pill-active {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .pill-inactive {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .url {
      font-size: 0.82rem;
      color: #a3a3a3;
      word-break: break-all;
      margin-bottom: 1.25rem;
      max-height: 4.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0.5rem;
      background: #181818;
      border-radius: 8px;
      border: 1px solid #282828;
    }
    .countdown {
      font-size: 3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.25rem;
      font-variant-numeric: tabular-nums;
    }
    .sub { font-size: 0.85rem; color: #737373; margin-bottom: 1rem; }
    .manual-link {
      display: inline-block;
      margin-top: 0.5rem;
      color: #38bdf8;
      text-decoration: underline;
      font-size: 0.85rem;
    }
    .error-box {
      color: #f87171;
      margin-top: 1rem;
      font-size: 0.88rem;
      line-height: 1.5;
      padding: 0.75rem 1rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 10px;
    }
    .home-btn {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.5rem 1.25rem;
      background: #262626;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    .home-btn:hover { background: #333; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <div class="icon-badge" id="icon-badge"></div>
    <div id="status-container"></div>
    <h1 id="title">Redirecting you…</h1>
    <div class="url" id="url-display">Resolving destination…</div>
    <div class="countdown" id="countdown">5</div>
    <div class="sub" id="countdown-sub">seconds remaining</div>
    <div>
      <a href="#" id="direct-link" class="manual-link" style="display:none">Click here if not redirected automatically</a>
    </div>
    <div class="error-box" id="error" style="display:none"></div>
    <div id="action-container" style="display:none">
      <a href="/" class="home-btn">Create a New Short Link</a>
    </div>
  </div>

  <script>
    (async function () {
      let countdownTimer = null;

      function stopEverything(badgeType, iconChar, title, message) {
        if (countdownTimer) {
          clearInterval(countdownTimer);
          countdownTimer = null;
        }
        document.getElementById('spinner').style.display = 'none';
        const badge = document.getElementById('icon-badge');
        badge.className = 'icon-badge ' + badgeType;
        badge.textContent = iconChar;
        badge.style.display = 'flex';

        document.getElementById('status-container').innerHTML =
          '<span class="status-pill pill-inactive">Link Inactive</span>';

        document.getElementById('title').textContent = title;
        document.getElementById('url-display').style.display = 'none';
        document.getElementById('countdown').style.display = 'none';
        document.getElementById('countdown-sub').style.display = 'none';
        document.getElementById('direct-link').style.display = 'none';

        const err = document.getElementById('error');
        err.textContent = message;
        err.style.display = 'block';

        document.getElementById('action-container').style.display = 'block';
        document.title = title + ' — Linko';
      }

      function tryDecode(raw) {
        if (!raw) return null;
        let trimmed = raw.trim();
        if (/^https?:\/\//i.test(trimmed)) return trimmed;

        // Try LZString
        if (window.LZString) {
          try {
            const decomp = window.LZString.decompressFromEncodedURIComponent(trimmed);
            if (decomp && /^https?:\/\//i.test(decomp)) return decomp;
          } catch (e) {}
          try {
            const decomp = window.LZString.decompressFromEncodedURIComponent(decodeURIComponent(trimmed));
            if (decomp && /^https?:\/\//i.test(decomp)) return decomp;
          } catch (e) {}
        }

        // Try base64
        try {
          let b64 = trimmed.replace(/-/g, '+').replace(/_/g, '/');
          while (b64.length % 4) b64 += '=';
          const dec = atob(b64);
          if (dec && /^https?:\/\//i.test(dec)) return dec;
        } catch (e) {}

        // Try decodeURIComponent
        try {
          const decUri = decodeURIComponent(trimmed);
          if (decUri && /^https?:\/\//i.test(decUri)) return decUri;
        } catch (e) {}

        return null;
      }

      // 1. Resolve pathCode and URL params
      const params = new URLSearchParams(window.location.search);
      let pathCode = '';
      const rMatch = window.location.pathname.match(/^\/(?:r|go)\/(.+)$/);
      if (rMatch) {
        pathCode = decodeURIComponent(rMatch[1].replace(/\/+$/, ''));
      } else {
        const rootMatch = window.location.pathname.match(/^\/([0-9a-zA-Z_-]+)$/);
        if (rootMatch && !['index.html', 'go.html', 'favicon.ico', 'go', 'app', 'shorten'].includes(rootMatch[1])) {
          pathCode = decodeURIComponent(rootMatch[1]);
        }
      }

      let clickLimit = null;
      if (params.get('limit')) {
        const parsed = parseInt(params.get('limit'), 10);
        if (!isNaN(parsed) && parsed > 0) clickLimit = parsed;
      }

      let destination = null;
      let matchedLink = null;
      let storageKey = null;
      let storageList = null;
      let expiresAt = null;

      // 1. Direct query param
      if (params.get('url')) {
        destination = tryDecode(params.get('url'));
      } else if (params.get('c')) {
        destination = tryDecode(params.get('c'));
      }

      // 2. Hash (#...)
      if (!destination && window.location.hash) {
        const hash = window.location.hash.slice(1);
        destination = tryDecode(hash);
      }

      // 3. Path code decode (if it was an encoded URL)
      if (!destination && pathCode) {
        destination = tryDecode(pathCode);
      }

      // 4. Local storage lookup
      try {
        const keys = ['lp_local_links', 'linkpulse_links_v2', 'linko_links', 'links'];
        for (const key of keys) {
          const raw = localStorage.getItem(key);
          if (raw) {
            const list = JSON.parse(raw);
            if (Array.isArray(list)) {
              const found = list.find(l => 
                (l.shortCode && pathCode && l.shortCode.toLowerCase() === pathCode.toLowerCase()) ||
                (l.code && pathCode && l.code.toLowerCase() === pathCode.toLowerCase()) ||
                (l.id && pathCode && l.id.toLowerCase() === pathCode.toLowerCase())
              );
              if (found) {
                matchedLink = found;
                storageKey = key;
                storageList = list;
                if (!destination) {
                  destination = found.originalUrl || found.url || found.targetUrl;
                }
                if (!clickLimit) {
                  if (found.rules?.clickLimit) clickLimit = parseInt(found.rules.clickLimit, 10);
                  else if (found.clickLimit) clickLimit = parseInt(found.clickLimit, 10);
                }
                if (found.rules?.expiresAt) expiresAt = found.rules.expiresAt;
                else if (found.expiresAt) expiresAt = found.expiresAt;
                break;
              }
            }
          }
        }
      } catch (e) {}

      // 5. Backend sync resolve (for fresh browser / incognito / cross-device)
      if (!destination && pathCode) {
        try {
          const res = await fetch('/api/analytics/resolve?code=' + encodeURIComponent(pathCode));
          if (res.ok) {
            const data = await res.json();
            if (data && data.url) {
              destination = data.url;
              if (!clickLimit && data.limit) clickLimit = parseInt(data.limit, 10);
            }
          }
        } catch (e) {}
      }

      // Validation check
      if (!destination || !/^https?:\/\//i.test(destination)) {
        stopEverything('badge-expired', '?', 'Link Not Found', 'No valid destination URL could be resolved for this link.');
        return;
      }

      // Google Safe Browsing / Threat Check
      try {
        const safetyRes = await fetch('/api/safety/check?url=' + encodeURIComponent(destination));
        if (safetyRes.ok) {
          const safetyData = await safetyRes.json();
          if (safetyData && safetyData.safe === false) {
            const threatLabel = safetyData.threatType ? safetyData.threatType.replace(/_/g, ' ') : 'Malicious Content';
            stopEverything(
              'badge-expired',
              '⚠️',
              'Dangerous Link Blocked',
              `Security check alert: ${threatLabel}. Redirection has been blocked for your protection.`
            );
            return;
          }
        }
      } catch (e) {
        console.warn('Safety check check skipped', e);
      }

      // Check Expiration Schedule
      if (expiresAt && new Date() > new Date(expiresAt)) {
        stopEverything(
          'badge-expired',
          '⏰',
          'Link Expired',
          `This link was scheduled to expire on ${new Date(expiresAt).toLocaleString()} and is no longer active.`
        );
        return;
      }

      // Check Client-side Click Limit
      if (clickLimit && matchedLink && typeof matchedLink.clicksCount === 'number' && matchedLink.clicksCount >= clickLimit) {
        stopEverything(
          'badge-limit',
          '🛑',
          'Click Limit Reached',
          `This link has reached its maximum visit limit of ${clickLimit} clicks and is no longer active.`
        );
        return;
      }

      document.getElementById('url-display').textContent = destination;
      document.title = 'Redirecting to ' + destination;

      const directLink = document.getElementById('direct-link');
      directLink.href = destination;
      directLink.style.display = 'inline-block';

      // Send Click to Analytics with Click Limit verification (Zero URL transmission)
      fetch('/api/analytics', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          code: pathCode || '',
          limit: clickLimit,
          timestamp: new Date().toISOString()
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data && data.allowed === false) {
          stopEverything(
            'badge-limit',
            '🛑',
            'Click Limit Reached',
            data.message || `This link has reached its maximum visit limit of ${data.limit || clickLimit} clicks.`
          );
          return;
        }

        // Update local storage click count if matched
        if (matchedLink && storageKey && storageList) {
          matchedLink.clicksCount = (matchedLink.clicksCount || 0) + 1;
          try {
            localStorage.setItem(storageKey, JSON.stringify(storageList));
          } catch (e) {}
        }

        if (clickLimit && data && data.count) {
          document.getElementById('countdown-sub').textContent =
            `Visit ${data.count} of ${clickLimit} · redirecting in seconds`;
        }
      })
      .catch(err => console.warn('Analytics ping failed', err));

      // 5-second countdown then redirect
      let remaining = 5;
      const el = document.getElementById('countdown');
      countdownTimer = setInterval(() => {
        remaining -= 1;
        el.textContent = remaining;
        if (remaining <= 0) {
          clearInterval(countdownTimer);
          countdownTimer = null;
          window.location.href = destination;
        }
      }, 1000);
    })();
  </script>
</body>
</html>
